<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2026 NBA Prospect Power Rankings</title>

<!-- MemberSpace -->
<script>
  var MemberSpace = window.MemberSpace || { subdomain: "draftdetective" };
  (function (d) {
    var s = d.createElement("script");
    s.src = "https://cdn.memberspace.com/scripts/widgets.js";
    s.async = true;
    d.head.appendChild(s);
  })(document);
</script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    margin: 0;
    padding: 24px;
    color: #222;
    background: #fff;
  }

  h2 {
    margin: 0 0 6px;
    font-size: 26px;
  }

  #status {
    margin-bottom: 14px;
    font-weight: 700;
    color: #2b3a93;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  th, td {
    padding: 9px 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
  }

  th {
    background: #f5f5f5;
    font-weight: 800;
  }

  tr:hover {
    background: #f9f9ff;
    cursor: pointer;
  }

  .badge {
    padding: 6px 14px;
    border-radius: 18px;
    font-weight: 800;
    font-size: 12px;
    display: inline-block;
  }

  .platinum { background: #e6e6e6; }
  .gold { background: #ffd700; }
  .silver { background: #c0c0c0; }
  .bronze { background: #cd7f32; color:#fff; }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    justify-content: center;
    align-items: flex-start;
    padding-top: 40px;
    z-index: 9999;
  }

  .card {
    background: #fffef8;
    width: 95%;
    max-width: 900px;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    position: relative;
  }

  .close {
    position: absolute;
    right: 12px;
    top: 8px;
    font-size: 22px;
    cursor: pointer;
  }

  .module {
    margin: 12px 0;
    padding: 10px 12px;
    border-left: 4px solid #2b3a93;
    background: #faf7ef;
    border-radius: 6px;
  }

  .module h3 {
    margin: 0 0 6px;
    font-size: 15px;
    color: #2b3a93;
  }

  .lock {
    margin-top: 14px;
    padding: 10px;
    border: 1px solid #e4d2a0;
    background: #fffaf0;
    border-radius: 6px;
  }
</style>
</head>

<body>

<h2>2026 NBA Prospect Power Rankings</h2>
<div id="status">Detecting membership…</div>

<table id="table">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Name</th>
      <th>Age</th>
      <th>Tier</th>
      <th>Height</th>
      <th>Weight</th>
      <th>Pos</th>
      <th>Team</th>
      <th>Wingspan</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="close" onclick="overlay.style.display='none'">×</div>
    <h3 id="cardName"></h3>
    <div id="modules"></div>
  </div>
</div>

<script>
const CSV =
  "https://raw.githubusercontent.com/patrickbostian89-coder/power_rankings/main/Profiles%20-%20Public%20Rankings%20(3).csv";

let rows = [];
let isPro = false;

function badge(t){
  t = (t||"").toLowerCase();
  if(t.includes("platinum")) return "platinum";
  if(t.includes("gold")) return "gold";
  if(t.includes("silver")) return "silver";
  if(t.includes("bronze")) return "bronze";
  return "";
}

function strip(s){
  return (s||"").replace(/^free\s*:\s*/i,"")
                .replace(/^pro\s*:\s*/i,"").trim();
}

Papa.parse(CSV,{
  download:true,
  header:true,
  complete:r=>{
    rows=r.data.filter(x=>x.Name);
    render();
  }
});

function render(){
  const tb=document.querySelector("tbody");
  tb.innerHTML="";
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.Rank||i+1}</td>
      <td><strong>${r.Name}</strong></td>
      <td>${r.Age||""}</td>
      <td><span class="badge ${badge(r.Tier)}">${r.Tier||""}</span></td>
      <td>${r.Height||""}</td>
      <td>${r.Weight||""}</td>
      <td>${r.Position||""}</td>
      <td>${r.Team||""}</td>
      <td>${r.Wingspan||""}</td>
    `;
    tr.onclick=()=>openCard(r);
    tb.appendChild(tr);
  });
}

function openCard(r){
  cardName.textContent=r.Name;
  modules.innerHTML="";

  const freeMods=[
    ["Defensive Profile",r.DefensiveProfile_free,r.DefensiveProfile_pro],
    ["Shot Quality Model",r.ShotQualityModel_free,r.ShotQualityModel_pro],
    ["Historical Echoes",r.HistoricalEchoes_free,r.HistoricalEchoes_pro]
  ];

  freeMods.forEach(m=>{
    const d=document.createElement("div");
    d.className="module";
    d.innerHTML=`<h3>${m[0]}</h3><p>${strip(m[1])}</p>`;
    if(isPro && m[2]) d.innerHTML+=`<p><strong>Pro:</strong><br>${strip(m[2])}</p>`;
    modules.appendChild(d);
  });

 if (isPro) {
  const proModules = [
    { label: "Cognitive Profile", key: "CognitiveProfile_pro" },
    { label: "Fit Matrix", key: "FitMatrix_pro" },
    { label: "Developmental Archetype", key: "DevelopmentalArchetype_pro" },
    { label: "Risk Profile", key: "RiskProfile_pro" }
  ];

  proModules.forEach(m => {
    if (r[m.key]) {
      const d = document.createElement("div");
      d.className = "module";
      d.innerHTML = `<h3>${m.label}</h3><p>${strip(r[m.key])}</p>`;
      modules.appendChild(d);
    }
  });
} else {
  const l = document.createElement("div");
  l.className = "lock";
  l.innerHTML = `🔒 Pro modules reserved for subscribers`;
  modules.appendChild(l);
}


  overlay.style.display="flex";
}

function detectPro(){
  MemberSpace.getMemberInfo(r=>{
    isPro = r?.memberInfo?.memberships?.some(m=>m.name==="Pro");
    status.textContent = isPro ? "Status: ✅ Pro unlocked" : "Status: Free view";
  });
}

document.addEventListener("MemberSpaceReady",detectPro);
</script>

</body>
</html>
