<!DOCTYPE html>
<html lang="en">
<head>

<!-- Memberstack v2 (DraftDetective project) -->
<script data-memberstack-app="app_cmj7p4oer000dsyf53dh2c30" src="https://static.memberstack.com/scripts/v2/memberstack.js" type="text/javascript"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 NBA Prospect Power Rankings</title>

<link rel="stylesheet" href="styles.css" />

</head>

<body>

<h1>Memberstack Test Page</h1>
<p id="status">Detecting membership…</p>

<button onclick="window.Memberstack.openModal('LOGIN')">
  Log in / Sign up
</button>

<script>
// ✅ IMPORTANT: Memberstack (lowercase "s")
window.Memberstack.onReady.then(async (ms) => {
  const member = await ms.getCurrentMember();
  const plans = member?.data?.plans || [];
  const names = plans.map(p => (p.name || '').toLowerCase());

  const isPro = names.includes("pro") || names.includes("elite");

  document.getElementById("status").textContent =
    isPro ? "Status: PRO" : "Status: FREE";
});
</script>

</body>
</html>
