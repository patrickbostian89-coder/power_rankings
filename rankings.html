<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Memberstack Test</title>

<!-- Memberstack v2 -->
<script 
  data-memberstack-app="app_cmjp8jcbi00i10suu1e3g7i54" 
  src="https://static.memberstack.com/scripts/v2/memberstack.js">
</script>

<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 40px;
    font-size: 20px;
  }
  button {
    padding: 12px 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
  }
</style>
</head>

<body>

<h1>Memberstack Test Page</h1>
<p id="status">Detecting membership…</p>

<button onclick="window.MemberStack.openModal('LOGIN')">
  Log in / Sign up
</button>

<script>
window.MemberStack.onReady.then(async (ms) => {
  const member = await ms.getCurrentMember();
  const plans = member?.data?.plans || [];
  const names = plans.map(p => (p.name || '').toLowerCase());

  const isPro = names.includes("pro") || names.includes("elite");

  document.getElementById("status").textContent =
    isPro ? "Status: PRO" : "Status: FREE";
});
</script>

</body>
</html>
