<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- Memberstack v2 -->
  <script data-memberstack-app="app_cmjp8jcbi00i10suu1e3g7i54" src="https://static.memberstack.com/scripts/v2/memberstack.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
  background-color: #ffffff;
  color: #111111;
}

.page-wrapper { max-width: 1100px; margin: 0 auto; }
.page-title { font-size: 22px; font-weight: 600; margin-bottom: 2px; }

.status-bar { font-size: 14px; color: #666; margin-bottom: 14px; }
.status-label { font-weight: 600; margin-right: 4px; }

.table-container {
  border: 1px solid #dedede;
  border-radius: 4px;
  background: #fff;
  max-height: 80vh;
  overflow-y: auto;
  overflow-x: hidden;
}

table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
thead th {
  position: sticky;
  top: 0;
  padding: 7px 9px;
  background: #f2f2f2;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

tbody tr { cursor: pointer; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: #f0f4ff; }

td { padding: 5px 9px; border-bottom: 1px solid #f0f0f0; }

.col-rank { width: 48px; text-align: right; padding-right: 12px; }
.col-name { width: 220px; }
.col-age { width: 56px; }
.col-tier { width: 88px; }
.col-height { width: 74px; }
.col-weight { width: 74px; }
.col-position { width: 76px; }

.tier-pill {
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}

.tier-platinum .tier-pill {
  background: linear-gradient(#fdfdfd, #d2d2d2);
  border: 1px solid #c8c8c8;
}

.tier-gold .tier-pill {
  background: linear-gradient(#f9e7a5, #c9a54a);
  border: 1px solid #b8943c;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-overlay.active { display: flex; }

.modal,
.modal * {
  pointer-events: auto;
}

.modal {
  background: #fff;
  border-radius: 6px;
  max-width: 720px;
  width: 95%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  padding: 12px 16px;
  background: #f7f7f7;
  display: flex;
  justify-content: space-between;
}

.modal-name { font-size: 20px; font-weight: 600; }
.modal-body { padding: 12px 16px; }

.modal-section-header {
  font-size: 15px;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 6px;
}

.locked-box {
  margin-top: 18px;
  padding: 12px 14px;
  background: #f5f5f5;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="page-wrapper">
  <h1 class="page-title">2026 NBA Prospect Power Rankings</h1>

  <div class="status-bar">
    <span class="status-label">Status:</span>
    <span id="statusText">Free view</span>
  </div>

  <div style="font-size:12px;color:#999;margin-bottom:6px;">
    Debug tier: <span id="debugTier">Free</span>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-rank">Rank</th>
          <th class="col-name">Name</th>
          <th class="col-age">Age</th>
          <th class="col-tier">Tier</th>
          <th class="col-height">Height</th>
          <th class="col-weight">Weight</th>
          <th class="col-position">Position</th>
          <th class="col-team">Team</th>
        </tr>
      </thead>
      <tbody id="rankingsBody"></tbody>
    </table>
  </div>

  <div id="notice">Loading live rankings…</div>
</div>

<div id="playerModalOverlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div id="modalName" class="modal-name"></div>
      <button id="modalCloseBtn">✕</button>
    </div>
    <div id="modalContent" class="modal-body"></div>
  </div>
</div>

<script>
const PUBLIC_CSV =
  "https://raw.githubusercontent.com/patrickbostian89-coder/power_rankings/main/Profiles%20-%20Public%20Rankings%20(3).csv";
const PROFILES_CSV =
  "https://raw.githubusercontent.com/patrickbostian89-coder/power_rankings/main/Profiles%20-%20Profiles%20(3).csv";

let detectedTier = "Free";
const publicByModalKey = {};
const profileByModalKey = {};

const modalOverlay = document.getElementById("playerModalOverlay");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const modalNameEl = document.getElementById("modalName");
const modalContentEl = document.getElementById("modalContent");

/* ================= MEMBERSTACK (ROBUST LOAD) ================= */

(function waitForMemberstack() {
  if (!window.MemberStack) {
    setTimeout(waitForMemberstack, 50);
    return;
  }

  window.MemberStack.onReady.then(async ms => {
    const member = await ms.getCurrentMember();
    console.log("👤 Member:", member);

    const plans = member?.data?.plans || [];
    const names = plans.map(p => (p.name || "").toLowerCase());

    detectedTier =
      names.includes("elite") ? "Elite" :
      names.includes("pro")   ? "Pro"   :
      "Free";

    document.getElementById("statusText").textContent =
      detectedTier + " view";
    document.getElementById("debugTier").textContent = detectedTier;
  });
})();



/* Table */
async function loadAndRenderTable() {
  const [pubText, profText] = await Promise.all([
    fetch(PUBLIC_CSV).then(r => r.text()),
    fetch(PROFILES_CSV).then(r => r.text())
  ]);

  Papa.parse(pubText, {header:true, skipEmptyLines:true}).data
    .forEach(r => r.ModalKey && (publicByModalKey[r.ModalKey] = r));

  Papa.parse(profText, {header:true, skipEmptyLines:true}).data
    .forEach(r => r.ModalKey && (profileByModalKey[r.ModalKey] = r));

  rankingsBody.innerHTML = "";
  Object.values(publicByModalKey).forEach(r => {
    const tierClass = r.Tier?.toLowerCase()==="platinum" ? "tier-platinum" :
                      r.Tier?.toLowerCase()==="gold" ? "tier-gold" : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.Rank}</td>
      <td>${r.Name}</td>
      <td>${r.Age||""}</td>
      <td class="${tierClass}">${r.Tier?`<span class="tier-pill">${r.Tier}</span>`:""}</td>
      <td>${r.Height||""}</td>
      <td>${r.Weight||""}</td>
      <td>${r.Position||""}</td>
      <td>${r.Team||""}</td>`;
    tr.onclick = () => openPlayerModal(r.ModalKey);
    rankingsBody.appendChild(tr);
  });
  notice.textContent = `Showing ${rankingsBody.children.length} prospects.`;
}

/* Modal */
function openPlayerModal(modalKey) {
  const p = publicByModalKey[modalKey] || {};
  const prof = profileByModalKey[modalKey] || {};
  modalNameEl.textContent = p.Name || "";

  let html = `
    <div class="modal-section-header">Snapshot</div>
    <div>Age: ${p.Age||"—"} | Tier: ${p.Tier||"—"} | Height: ${p.Height||"—"} |
    Weight: ${p.Weight||"—"} | Pos: ${p.Position||"—"} | Team: ${p.Team||"—"}</div>
  `;

  ["SpatialIQ","FitMatrix","DefensiveProfile"].forEach(k=>{
    const txt = prof[k+"_free"]||p[k+"_free"];
    if(txt) html+=`<div class="modal-section-header">${k}</div><div>${txt}</div>`;
  });

  const proKeys=["ArchetypeDrift","RiskIndex","MaturityIndex","DiagnosticOverlay","FilteredMetrics","ShotQualityModel","HistoricalEchoes"];
  if(detectedTier==="Pro"||detectedTier==="Elite"){
    proKeys.forEach(k=>{
      const txt = prof[k+"_pro"]||p[k+"_pro"];
      if(txt) html+=`<div class="modal-section-header">${k}</div><div>${txt}</div>`;
    });
  } else {
    html+=`
      <div class="locked-box">
        <div class="modal-section-header">Pro Modules</div>
        <ul>${proKeys.map(k=>`<li>🔒 ${k}</li>`).join("")}</ul>
        <a href="https://buy.stripe.com/7sY6oH3RvbND5aI2Ba5gc00"
           target="_blank" rel="noopener"
           onclick="event.stopPropagation();"
           style="display:inline-block;margin-top:6px;padding:10px 14px;
           background:#111;color:#fff;border-radius:6px;text-decoration:none;">
          Upgrade to Pro
        </a>
      </div>`;
  }

  modalContentEl.innerHTML = html;
  modalOverlay.classList.add("active");
  modalContentEl.onclick = e => e.stopPropagation();
  modalNameEl.onclick = e => e.stopPropagation();
}

modalCloseBtn.onclick = () => modalOverlay.classList.remove("active");
modalOverlay.onclick = e => e.target === modalOverlay && modalOverlay.classList.remove("active");

loadAndRenderTable();
</script>

</body>
</html>
